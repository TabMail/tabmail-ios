      fix: "Stagger: Active* immediately, Backfill*/Memory after the first-paint settle window.",

    { title: "DB build & FTS/Embedding are already well-placed — don't regress", sev: "low",
      problem: "These were the historical hang sources and are now off-main, splash-gated and post-render. The QoS-lever to lower their priority was tried and reverted (risked starving FTS/embeddings under Low Power Mode).",

          '<li>Cold-boot → inbox: <b>+22,207ms</b>.</li>' +
        '</ul></div>' +
      '<div class="col after"><h4><span class="tag">after</span> gated + indexed</h4>' +
        '<ul>' +
